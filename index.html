<style>
:root {

}
* { box-sizing: border-box; }
body {

h2 { font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-muted); margin: 0 0 14px; font-weight: 650; }
a.card {
  display: block; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 20px 24px; text-decoration: none; color: inherit;
  transition: border-color .15s ease, transform .15s ease;
}
a.card:hover { border-color: var(--accent); transform: translateY(-1px); }
a.card .t { font-size: 1.12rem; font-weight: 650; color: var(--accent); margin-bottom: 4px; }
a.card .d { font-size: 14.5px; color: var(--ink-soft); }
footer { margin-top: 56px; padding-top: 22px; border-top: 1px solid var(--line);
